[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-edition-devkit"
version = "0.1.0"
description = "Reference developer kit for inspecting, validating, parsing, querying, and comparing Machine Editions (v0.1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lynn Media", email = "research@winmedia.com" }
]
dependencies = [
    "jsonschema>=4.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
